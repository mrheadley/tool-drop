    /**
     * Application State & LocalStorage Manager
     */
    const STORAGE_KEY = 'ngc_form1_greek_myths_v1';

    const defaultState = {
      readingSupport: false,
      missionProgress: {}, // { m1: { bestScore: 85, mastered: true, firstAttemptResults: { qId: true/false } } }
      activeView: 'home', // 'home' | 'mission' | 'retry' | 'summary'
      currentMissionId: null,
      currentQuestionIndex: 0,
      sessionQuestions: [],
      sessionResults: [], // [{ questionId, topic, skill, isCorrect, isFirstAttempt }]
      isRetryMode: false,
      retryTitle: ''
    };

    const app = {
      state: JSON.parse(JSON.stringify(defaultState)),

      init() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            this.state.readingSupport = !!parsed.readingSupport;
            this.state.missionProgress = parsed.missionProgress || {};
          }
        } catch (e) {
          console.warn('Could not read localStorage:', e);
        }
        this.applyReadingSupport();
        this.render();
      },

      saveState() {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              readingSupport: this.state.readingSupport,
              missionProgress: this.state.missionProgress
            })
          );
        } catch (e) {
          console.warn('Could not save to localStorage:', e);
        }
      },

      toggleReadingSupport() {
        this.state.readingSupport = !this.state.readingSupport;
        this.applyReadingSupport();
        this.saveState();
      },

      applyReadingSupport() {
        const btn = document.getElementById('readingToggleBtn');
        const label = document.getElementById('readingToggleLabel');
        if (this.state.readingSupport) {
          document.body.classList.add('reading-support');
          btn.setAttribute('aria-pressed', 'true');
          btn.classList.add('bg-amber-100', 'border-amber-600', 'text-amber-900');
          btn.classList.remove('bg-white', 'text-slate-700');
          label.textContent = 'Reading Support: On';
        } else {
          document.body.classList.remove('reading-support');
          btn.setAttribute('aria-pressed', 'false');
          btn.classList.remove('bg-amber-100', 'border-amber-600', 'text-amber-900');
          btn.classList.add('bg-white', 'text-slate-700');
          label.textContent = 'Reading Support: Off';
        }
      },

      goHome() {
        this.state.activeView = 'home';
        this.state.currentMissionId = null;
        this.state.isRetryMode = false;
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      startMission(missionId) {
        const mission = MISSIONS.find((m) => m.id === missionId);
        if (!mission) return;
        this.state.activeView = 'mission';
        this.state.currentMissionId = missionId;
        this.state.currentQuestionIndex = 0;
        this.state.sessionQuestions = mission.questions;
        this.state.sessionResults = [];
        this.state.isRetryMode = false;
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      startConfidenceRetry(missionId) {
        const mission = MISSIONS.find((m) => m.id === missionId);
        if (!mission) return;
        // Pick 2 targeted retry questions for this mission
        const missionExtras = EXTRA_RETRY_QUESTIONS.filter((q) => q.missionId === missionId);
        // Also pull up to 1 missed objective question from the mission if needed
        const prev = this.state.missionProgress[missionId] || {};
        const missedFromMission = mission.questions.filter(
          (q) => prev.firstAttemptResults && prev.firstAttemptResults[q.id] === false
        );
        const pool = [...missionExtras, ...missedFromMission];
        const retrySet = pool.slice(0, 2);

        this.state.activeView = 'mission';
        this.state.currentMissionId = missionId;
        this.state.currentQuestionIndex = 0;
        this.state.sessionQuestions = retrySet.length > 0 ? retrySet : mission.questions.slice(0, 2);
        this.state.sessionResults = [];
        this.state.isRetryMode = true;
        this.state.retryTitle = `Confidence Boost: ${mission.title}`;
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      startWeakestPractice(weakSkill) {
        // Gather questions matching the student's weakest skill across all missions & retry pool
        const allQuestions = [
          ...MISSIONS.flatMap((m) => m.questions),
          ...EXTRA_RETRY_QUESTIONS
        ];
        let targeted = allQuestions.filter((q) => q.skill === weakSkill);
        // Prioritize objective/interactive ones plus 1 written one so it's snappy
        targeted = targeted.slice(0, 4);

        this.state.activeView = 'mission';
        this.state.currentMissionId = 'weakest_practice';
        this.state.currentQuestionIndex = 0;
        this.state.sessionQuestions = targeted;
        this.state.sessionResults = [];
        this.state.isRetryMode = true;
        this.state.retryTitle = `Targeted Practice: ${this.getFriendlySkillName(weakSkill)}`;
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      showSummary() {
        this.state.activeView = 'summary';
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      confirmReset() {
        const container = document.getElementById('resetContainer');
        container.innerHTML = `
          <span class="text-slate-700 font-medium mr-2">Clear all badges & scores?</span>
          <button onclick="app.executeReset()" class="px-2.5 py-1 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700 mr-1">Yes, Reset</button>
          <button onclick="app.cancelReset()" class="px-2.5 py-1 bg-slate-200 text-slate-700 rounded-lg font-semibold hover:bg-slate-300">Cancel</button>
        `;
      },

      cancelReset() {
        const container = document.getElementById('resetContainer');
        container.innerHTML = `
          <button onclick="app.confirmReset()" class="text-slate-500 hover:text-red-700 underline font-medium">
            Reset All Progress
          </button>
        `;
      },

      executeReset() {
        this.state.missionProgress = {};
        this.saveState();
        this.cancelReset();
        this.goHome();
      },

      getFriendlySkillName(skill) {
        if (skill === 'Knowledge') return 'Facts & Characters (Knowledge)';
        if (skill === 'Understanding') return 'Story Meanings & Reasons (Understanding)';
        return 'Real-World Links & Critical Thinking (Application)';
      },

      /**
       * Main Router
       */
      render() {
        const container = document.getElementById('appContainer');
        if (this.state.activeView === 'home') {
          container.innerHTML = this.renderHome();
        } else if (this.state.activeView === 'mission') {
          container.innerHTML = this.renderQuestionView();
        } else if (this.state.activeView === 'mission_complete') {
          container.innerHTML = this.renderMissionComplete();
        } else if (this.state.activeView === 'summary') {
          container.innerHTML = this.renderSummaryView();
        }
      },

      renderHome() {
        const totalMissions = MISSIONS.length;
        const masteredCount = MISSIONS.filter(

        const missionCardsHtml = MISSIONS.map((m) => {

            statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300">Best: ${bestScore}% • Retry Ready</span>`;
          }

          return `

              <div>
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">

                    <span>${m.icon}</span> Mission ${m.number}

                  ${statusBadge}
                </div>
                <h3 class="text-lg sm:text-xl font-bold text-slate-900 mb-1">${m.title}</h3>
                <p class="text-xs font-semibold text-slate-500 mb-2.5">${m.subtitle}</p>
                <p class="text-sm text-slate-600">${m.description}</p>
              </div>

              <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
                <span class="text-xs text-slate-500 font-medium">${m.questions.length} Practice Challenges</span>
                <div class="flex items-center gap-2">
                  ${
                    needsBoost
                      ? `<button onclick="app.startConfidenceRetry('${m.id}')" class="px-3.5 py-2 rounded-xl bg-amber-100 text-amber-900 text-xs sm:text-sm font-bold hover:bg-amber-200 transition">
                          ⚡ 2-Question Boost
                        </button>`
                      : ''
                  }
                  <button onclick="app.startMission('${m.id}')" class="px-4 py-2 rounded-xl ${
            isMastered
              ? 'bg-slate-100 text-slate-800 hover:bg-slate-200'
              : 'bg-amber-700 text-white hover:bg-amber-800 shadow-sm'
          } text-xs sm:text-sm font-bold transition">
                    ${isMastered ? 'Practice Again' : 'Start Mission →'}
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="space-y-6">
            <!-- Hero Welcome Banner -->
            <section class="myth-card p-6 sm:p-8 bg-gradient-to-br from-white via-amber-50/40 to-orange-50/40">
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div class="space-y-2 max-w-xl">
                  <span class="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-bold">
                    Term 1 English B Exam Practice
                  </span>
                  <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">

                    Practice each mission at your own pace—there are <strong>no countdown timers</strong>. Score <strong>80% or higher</strong> on a mission to unlock its Mastery Badge, and check <strong>My Study Plan</strong> anytime to see what to review next.

                  </div>
                  <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden mb-2">

       */
      renderQuestionView() {
        const qIndex = this.state.currentQuestionIndex;
        const totalQ = this.state.sessionQuestions.length;
        const q = this.state.sessionQuestions[qIndex];
        const mission = MISSIONS.find((m) => m.id === this.state.currentMissionId);
        const headerTitle = this.state.isRetryMode
          ? this.state.retryTitle
          : `Mission ${mission.number}: ${mission.title}`;

        const progressPct = Math.round(((qIndex + 1) / totalQ) * 100);

        let bodyHtml = '';
        if (q.type === 'mcq') {
          bodyHtml = this.renderMcqBody(q);
        } else if (q.type === 'matching') {
          bodyHtml = this.renderMatchingBody(q);
        } else if (q.type === 'spot_error') {
          bodyHtml = this.renderSpotErrorBody(q);
        } else if (q.type === 'cloze') {
          bodyHtml = this.renderClozeBody(q);
        } else if (q.type === 'extract') {
          bodyHtml = this.renderExtractBody(q);
        } else if (q.type === 'modern_scenario') {
          bodyHtml = this.renderModernScenarioBody(q);

          bodyHtml = this.renderCriticalFrameBody(q);

              </button>
              <span class="text-xs font-bold text-slate-500 bg-white px-3 py-1.5 rounded-full border border-slate-200">
                ${q.topic} • ${this.getFriendlySkillName(q.skill).split(' ')[0]}
              </span>
            </div>

            <div class="myth-card p-5 sm:p-8">
              <!-- Mission Title & Step Indicator -->
              <div class="mb-6">
                <div class="flex items-center justify-between text-xs font-bold text-amber-800 uppercase tracking-wider mb-2">
                  <span>${headerTitle}</span>
                  <span>Question ${qIndex + 1} of ${totalQ}</span>
                </div>
                <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full bg-amber-600 rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
                </div>
              </div>

              <!-- Question Content -->
              <div id="questionWorkspace">
                ${bodyHtml}
              </div>

              <!-- Feedback & Next Step Area (Hidden until submitted) -->
              <div id="feedbackArea" class="hidden mt-6 pt-6 border-t border-slate-200"></div>
            </div>
          </div>
        `;
      },

      /**
       * 1. Multiple Choice Renderer & Checker
       */
      renderMcqBody(q) {
        const letters = ['A', 'B', 'C', 'D'];
        return `
          <h2 class="text-lg sm:text-xl font-bold text-slate-900 mb-5">${q.prompt}</h2>
          <div class="space-y-3" id="mcqOptions">
            ${q.options
              .map(
                (opt, idx) => `
              <button
                onclick="app.checkMcq(${idx})"
                data-idx="${idx}"
                class="option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white flex items-start gap-3.5 focus:outline-none focus:ring-2 focus:ring-amber-500"
              >
                <span class="w-8 h-8 rounded-lg bg-slate-100 text-slate-700 font-bold text-sm flex items-center justify-center shrink-0 mt-0.5">
                  ${letters[idx]}
                </span>
                <span class="text-slate-800 font-medium">${opt}</span>
              </button>
            `
              )
              .join('')}
          </div>
        `;
      },

      checkMcq(selectedIndex) {
        const q = this.state.sessionQuestions[this.state.currentQuestionIndex];
        const isCorrect = selectedIndex === q.correctIndex;
        const buttons = document.querySelectorAll('#mcqOptions button');

        buttons.forEach((btn, idx) => {
          btn.disabled = true;
          btn.classList.remove('option-btn');
          if (idx === q.correctIndex) {
            btn.classList.remove('border-slate-200', 'bg-white');
            btn.classList.add('border-green-600', 'bg-green-50');
            btn.querySelector('span:first-child').classList.add('bg-green-600', 'text-white');
          } else if (idx === selectedIndex && !isCorrect) {
            btn.classList.remove('border-slate-200', 'bg-white');
            btn.classList.add('border-red-500', 'bg-red-50');
            btn.querySelector('span:first-child').classList.add('bg-red-600', 'text-white');
          } else {
            btn.classList.add('opacity-60');
          }
        });

        this.recordAndShowFeedback(isCorrect, q.explanation);
      },

      /**
       * 2. Matching Table Renderer & Checker
       */
      renderMatchingBody(q) {
        // Shuffle right-hand options deterministically for display
        const shuffledRights = [...q.pairs]
          .map((p, i) => ({ text: p.right, origIdx: i }))
          .sort((a, b) => a.text.localeCompare(b.text));

        return `
          <h2 class="text-lg sm:text-xl font-bold text-slate-900 mb-2">${q.prompt}</h2>
          <p class="text-sm text-slate-600 mb-5">Select the matching action or description from each dropdown menu.</p>
          <div class="space-y-3.5" id="matchingRows">
            ${q.pairs
              .map(
                (pair, rowIdx) => `
              <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <span class="font-bold text-slate-900 sm:w-1/3">${pair.left}</span>
                <select
                  id="matchSelect_${rowIdx}"
                  class="sm:w-2/3 p-3 rounded-xl border border-slate-300 bg-white text-slate-800 text-sm font-medium focus:outline-none focus:border-amber-600"
                >
                  <option value="">-- Choose the best match --</option>
                  ${shuffledRights
                    .map(
                      (r) => `<option value="${r.origIdx}">${r.text}</option>`
                    )
                    .join('')}
                </select>
              </div>
            `
              )
              .join('')}
          </div>
          <div class="mt-6">
            <button id="submitMatchBtn" onclick="app.checkMatching()" class="px-6 py-3 rounded-xl bg-amber-700 text-white font-bold text-sm hover:bg-amber-800 transition shadow-sm">
              Check My Matches
            </button>
          </div>
        `;
      },

      checkMatching() {
        const q = this.state.sessionQuestions[this.state.currentQuestionIndex];
        let allSelected = true;
        let correctCount = 0;

        q.pairs.forEach((_, idx) => {
          const sel = document.getElementById(`matchSelect_${idx}`);
          if (sel.value === '') allSelected = false;
        });

        if (!allSelected) {
          this.showInlineAlert('Please choose a match for every character before checking your answer!');
          return;
        }

        q.pairs.forEach((pair, idx) => {
          const sel = document.getElementById(`matchSelect_${idx}`);
          sel.disabled = true;
          const rowDiv = sel.parentElement;
          if (parseInt(sel.value, 10) === idx) {
            correctCount++;
            rowDiv.classList.remove('bg-slate-50', 'border-slate-200');
            rowDiv.classList.add('bg-green-50', 'border-green-500');
          } else {
            rowDiv.classList.remove('bg-slate-50', 'border-slate-200');
            rowDiv.classList.add('bg-red-50', 'border-red-400');
            const fixNote = document.createElement('p');
            fixNote.className = 'text-xs font-semibold text-green-800 mt-1 sm:col-span-2';
            fixNote.textContent = `✓ Correct match: ${pair.right}`;
            rowDiv.appendChild(fixNote);
          }
        });

        document.getElementById('submitMatchBtn').classList.add('hidden');
        const isCorrect = correctCount === q.pairs.length;
        const summaryMsg = isCorrect
          ? q.explanation
          : `You matched ${correctCount} out of ${q.pairs.length} correctly. Check the green notes above to review the ones you missed!`;
        this.recordAndShowFeedback(isCorrect, summaryMsg);
      },

      /**
       * 3. Spot-the-Mistake Table Renderer & Checker
       */
      renderSpotErrorBody(q) {
        return `
          <h2 class="text-lg sm:text-xl font-bold text-slate-900 mb-2">${q.prompt}</h2>
          <p class="text-sm text-slate-600 mb-5">Read each student note carefully and pick the fix that matches our class book.</p>
          <div class="space-y-4">
            ${q.rows
              .map(
                (row, rIdx) => `
              <div id="spotRow_${rIdx}" class="p-4 rounded-xl bg-amber-50/50 border border-amber-200/80 space-y-3">
                <p class="text-sm font-semibold text-slate-800">
                  <span class="inline-block px-2 py-0.5 rounded bg-red-100 text-red-800 text-xs font-bold mr-1.5">Mistake ${rIdx + 1}</span>
                  ${row.statement}
                </p>
                <div class="grid grid-cols-1 gap-2">
                  ${row.options
                    .map(
                      (opt, oIdx) => `
                    <label class="flex items-start gap-2.5 p-3 rounded-lg bg-white border border-slate-200 cursor-pointer hover:border-amber-500 text-sm">
                      <input type="radio" name="spot_${rIdx}" value="${oIdx}" class="mt-1 accent-amber-700" />
                      <span class="text-slate-800">${opt}</span>
                    </label>
                  `
                    )
                    .join('')}
                </div>
              </div>
            `
              )
              .join('')}
          </div>
          <div class="mt-6">
            <button id="submitSpotBtn" onclick="app.checkSpotError()" class="px-6 py-3 rounded-xl bg-amber-700 text-white font-bold text-sm hover:bg-amber-800 transition shadow-sm">
              Check My Fixes
            </button>
          </div>
        `;
      },

      checkSpotError() {
        const q = this.state.sessionQuestions[this.state.currentQuestionIndex];
        let allAnswered = true;
        let correctCount = 0;

        q.rows.forEach((_, rIdx) => {
          const checked = document.querySelector(`input[name="spot_${rIdx}"]:checked`);
          if (!checked) allAnswered = false;
        });

        if (!allAnswered) {
          this.showInlineAlert('Please pick a fix for every statement before checking!');
          return;
        }

        q.rows.forEach((row, rIdx) => {
          const checked = document.querySelector(`input[name="spot_${rIdx}"]:checked`);
          const val = parseInt(checked.value, 10);
          const rowBox = document.getElementById(`spotRow_${rIdx}`);
          document.querySelectorAll(`input[name="spot_${rIdx}"]`).forEach((inp) => (inp.disabled = true));

          if (val === row.correctIndex) {
            correctCount++;
            rowBox.classList.remove('bg-amber-50/50', 'border-amber-200/80');
            rowBox.classList.add('bg-green-50', 'border-green-500');
          } else {
            rowBox.classList.remove('bg-amber-50/50', 'border-amber-200/80');
            rowBox.classList.add('bg-red-50', 'border-red-400');
          }
        });

        document.getElementById('submitSpotBtn').classList.add('hidden');
        const isCorrect = correctCount === q.rows.length;
        const msg = isCorrect
          ? q.explanation
          : `You spotted ${correctCount} out of ${q.rows.length} fixes! Review the highlighted boxes above to lock in the right details.`;
        this.recordAndShowFeedback(isCorrect, msg);
      },

      /**
       * 4. Word Bank Fill-In (Cloze) Renderer & Checker
       */
      renderClozeBody(q) {
        const sortedBank = [...q.wordBank].sort();
        let paragraphHtml = '';
        q.segments.forEach((seg, idx) => {
          paragraphHtml += `<span>${seg}</span>`;
          if (idx < q.answers.length) {
            paragraphHtml += `
              <select id="cloze_${idx}" class="mx-1 my-1 px-2.5 py-1 rounded-lg border-2 border-amber-300 bg-amber-50/60 font-bold text-slate-900 text-sm focus:outline-none focus:border-amber-700">
                <option value="">[ Choose ]</option>
                ${sortedBank.map((w) => `<option value="${w}">${w}</option>`).join('')}
              </select>
            `;
          }
        });

        return `
          <h2 class="text-lg sm:text-xl font-bold text-slate-900 mb-3">${q.prompt}</h2>
          <div class="p-3.5 rounded-xl bg-slate-100 border border-slate-200 mb-5 text-xs sm:text-sm">
            <span class="font-bold text-slate-700 mr-2">Word Bank:</span>
            <span class="text-slate-700 font-medium">${sortedBank.join(' • ')}</span>
          </div>
          <div class="p-5 rounded-xl bg-white border border-slate-200 text-slate-800 leading-loose text-base">
            ${paragraphHtml}
          </div>
          <div class="mt-6">
            <button id="submitClozeBtn" onclick="app.checkCloze()" class="px-6 py-3 rounded-xl bg-amber-700 text-white font-bold text-sm hover:bg-amber-800 transition shadow-sm">
              Check Word Bank Fill-In
            </button>
          </div>
        `;
      },

      checkCloze() {
        const q = this.state.sessionQuestions[this.state.currentQuestionIndex];
        let allFilled = true;
        let correctCount = 0;

        q.answers.forEach((_, idx) => {
          const sel = document.getElementById(`cloze_${idx}`);
          if (!sel.value) allFilled = false;
        });

        if (!allFilled) {
          this.showInlineAlert('Please fill in all 6 blanks from the Word Bank first!');
          return;
        }

        q.answers.forEach((ans, idx) => {
          const sel = document.getElementById(`cloze_${idx}`);
          sel.disabled = true;
          if (sel.value === ans) {
            correctCount++;
            sel.classList.remove('border-amber-300', 'bg-amber-50/60');
            sel.classList.add('border-green-600', 'bg-green-100', 'text-green-900');
          } else {
            sel.classList.remove('border-amber-300', 'bg-amber-50/60');
            sel.classList.add('border-red-500', 'bg-red-100', 'text-red-900');
            const hintSpan = document.createElement('span');
            hintSpan.className = 'text-xs font-bold text-green-800 bg-green-100 px-2 py-0.5 rounded ml-1';
            hintSpan.textContent = `✓ ${ans}`;
            sel.insertAdjacentElement('afterend', hintSpan);
          }
        });

        document.getElementById('submitClozeBtn').classList.add('hidden');
        const isCorrect = correctCount >= q.answers.length - 1; // 5/6 or 6/6 counts as mastery on cloze
        const msg =
          correctCount === q.answers.length
            ? q.explanation
            : `You got ${correctCount} out of ${q.answers.length} right! Check the green tags next to any missed blanks.`;
        this.recordAndShowFeedback(isCorrect, msg);
      },

      /**
       * 5. Reading Extract (Short Answer + Hint + Self-Check Rubric)
       */
      renderExtractBody(q) {
        return `
          <div class="mb-5 p-4 sm:p-5 rounded-xl bg-amber-50/70 border-l-4 border-amber-700">
            <p class="text-xs font-bold uppercase tracking-wider text-amber-900 mb-1.5">${q.passageTitle}</p>
            <blockquote class="italic text-slate-800 text-sm sm:text-base">${q.passage}</blockquote>
          </div>

          <h2 class="text-lg sm:text-xl font-bold text-slate-900 mb-3">${q.question}</h2>

          <!-- Progressive Hint Button -->
          <div class="mb-3">
            <button type="button" onclick="app.toggleHint('hintBox')" class="text-xs sm:text-sm font-semibold text-amber-800 hover:text-amber-950 underline flex items-center gap-1.5">
              <span>💡 Need a Hint? Show Sentence Starter</span>
            </button>
            <div id="hintBox" class="hidden mt-2 p-3 rounded-xl bg-blue-50 border border-blue-200 text-xs sm:text-sm text-blue-900">
              <strong>Sentence Starter:</strong> ${q.hint}
            </div>
          </div>

          <textarea
            id="writtenInput"
            rows="3"
            placeholder="Write your answer in complete sentences here..."
            class="w-full p-3.5 rounded-xl border-2 border-slate-200 bg-white text-slate-800 text-sm sm:text-base focus:outline-none focus:border-amber-600"
          ></textarea>

          <div class="mt-4" id="writtenActionArea">
            <button onclick="app.revealSelfCheck()" class="px-6 py-3 rounded-xl bg-amber-700 text-white font-bold text-sm hover:bg-amber-800 transition shadow-sm">
              Compare with Model Answer →
            </button>
          </div>

          <div id="selfCheckArea" class="hidden mt-6 space-y-4"></div>
        `;
      },

      /**
       * 6. Modern Real-World Scenario (Myth Match + 1-Sentence Lesson + Self-Check)
       */
      renderModernScenarioBody(q) {
        return `
          <div class="p-4 sm:p-5 rounded-xl bg-slate-100 border border-slate-200 mb-5">
            <span class="inline-block px-2.5 py-0.5 rounded bg-slate-800 text-white text-xs font-bold mb-2">Real-World Connection</span>
            <p class="text-slate-900 font-medium text-sm sm:text-base">${q.scenario}</p>
          </div>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-bold text-slate-800 mb-1.5">1. Which Greek myth or character connects best to this situation?</label>
              <select id="modernMythSelect" class="w-full sm:w-2/3 p-3 rounded-xl border-2 border-slate-200 bg-white text-slate-800 font-semibold text-sm focus:outline-none focus:border-amber-600">
                <option value="">-- Choose a myth/character --</option>
                ${q.wordBank.map((m) => `<option value="${m}">${m}</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-800 mb-1.5">2. Explain the lesson in ONE complete sentence:</label>
              <button type="button" onclick="app.toggleHint('hintBox')" class="text-xs font-semibold text-amber-800 underline mb-2 block">
                💡 Need a Hint? Show Sentence Starter
              </button>
              <div id="hintBox" class="hidden mb-2 p-3 rounded-xl bg-blue-50 border border-blue-200 text-xs sm:text-sm text-blue-900">
                <strong>Sentence Starter:</strong> ${q.hint}
              </div>
              <textarea
                id="writtenInput"
                rows="2"
                placeholder="Write your 1-sentence lesson here..."
                class="w-full p-3.5 rounded-xl border-2 border-slate-200 bg-white text-slate-800 text-sm sm:text-base focus:outline-none focus:border-amber-600"
              ></textarea>
            </div>
          </div>

          <div class="mt-4" id="writtenActionArea">
            <button onclick="app.checkModernScenario()" class="px-6 py-3 rounded-xl bg-amber-700 text-white font-bold text-sm hover:bg-amber-800 transition shadow-sm">
              Check My Match & Compare Lesson →
            </button>
          </div>

          <div id="selfCheckArea" class="hidden mt-6 space-y-4"></div>
        `;
      },

      checkModernScenario() {
        const q = this.state.sessionQuestions[this.state.currentQuestionIndex];
        const sel = document.getElementById('modernMythSelect');
        const txt = document.getElementById('writtenInput').value.trim();

        if (!sel.value || txt.length < 5) {
          this.showInlineAlert('Please choose a matching myth AND write your 1-sentence lesson before checking!');
          return;
        }

        sel.disabled = true;
        const mythMatched = sel.value === q.correctMyth;
        if (mythMatched) {
          sel.classList.add('border-green-600', 'bg-green-50');
        } else {
          sel.classList.add('border-red-500', 'bg-red-50');
        }

        this.revealSelfCheck(
          mythMatched
            ? `✅ Great match! You correctly connected this scenario to <strong>${q.correctMyth}</strong>.`
            : `❌ Not quite—the best match is <strong>${q.correctMyth}</strong>. Compare your lesson sentence below!`
        );
      },

      /**
       * 7. Critical Thinking 4-Step Frame (Claim + Story Clue 1 + Story Clue 2 + Final Lesson)
       */
      renderCriticalFrameBody(q) {
        return `
          <div class="p-4 sm:p-5 rounded-xl bg-amber-50 border border-amber-200 mb-5">
            <span class="inline-block px-2.5 py-0.5 rounded bg-amber-800 text-white text-xs font-bold mb-2">Section 4 Practice • Critical Thinking</span>
            <h2 class="text-base sm:text-lg font-bold text-slate-900">${q.bigQuestion}</h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">${q.prompt}</p>
          </div>

          <div class="mb-4">
            <button type="button" onclick="app.toggleHint('hintBox')" class="text-xs sm:text-sm font-semibold text-amber-800 underline flex items-center gap-1.5">
              <span>💡 Need a Hint? Show Example Starters for All 4 Steps</span>
            </button>
            <div id="hintBox" class="hidden mt-2 p-3.5 rounded-xl bg-blue-50 border border-blue-200 text-xs sm:text-sm text-blue-950 space-y-1.5">
              ${q.steps.map((s) => `<p><strong>${s.label}:</strong> ${s.hintStarter}</p>`).join('')}
            </div>
          </div>

          <div class="space-y-4">
            ${q.steps
              .map(
                (step, idx) => `
              <div>
                <label class="block text-sm font-bold text-slate-800 mb-1">${step.label}</label>
                <textarea
                  id="critStep_${idx}"
                  rows="2"
                  placeholder="${step.placeholder}"
                  class="w-full p-3 rounded-xl border-2 border-slate-200 bg-white text-slate-800 text-sm focus:outline-none focus:border-amber-600"
                ></textarea>
              </div>
            `
              )
              .join('')}
          </div>

          <div class="mt-5" id="writtenActionArea">
            <button onclick="app.checkCriticalFrame()" class="px-6 py-3 rounded-xl bg-amber-700 text-white font-bold text-sm hover:bg-amber-800 transition shadow-sm">
              Compare with Model Answer →
            </button>
          </div>

          <div id="selfCheckArea" class="hidden mt-6 space-y-4"></div>
        `;
      },

      checkCriticalFrame() {
        const q = this.state.sessionQuestions[this.state.currentQuestionIndex];
        let allFilled = true;
        q.steps.forEach((_, idx) => {
          const val = document.getElementById(`critStep_${idx}`).value.trim();
          if (val.length < 4) allFilled = false;
        });

        if (!allFilled) {
          this.showInlineAlert('Please fill in all 4 steps (Claim, Story Clue 1, Story Clue 2, and Final Lesson) before checking!');
          return;
        }

        q.steps.forEach((_, idx) => {
          document.getElementById(`critStep_${idx}`).disabled = true;
        });

        this.revealSelfCheck();
      },

      /**
       * Shared Self-Check Rubric & Model Answer Handler for Written Responses
       */
      revealSelfCheck(extraBannerHtml = '') {
        const q = this.state.sessionQuestions[this.state.currentQuestionIndex];
        const writtenInput = document.getElementById('writtenInput');
        if (writtenInput) {
          if (writtenInput.value.trim().length < 5) {
            this.showInlineAlert('Please type your answer first before comparing with the model answer!');
            return;
          }
          writtenInput.disabled = true;
        }

        document.getElementById('writtenActionArea').classList.add('hidden');
        const selfCheckDiv = document.getElementById('selfCheckArea');
        selfCheckDiv.classList.remove('hidden');

        selfCheckDiv.innerHTML = `
          ${
            extraBannerHtml
              ? `<div class="p-3.5 rounded-xl bg-slate-100 border border-slate-300 text-sm text-slate-900">${extraBannerHtml}</div>`
              : ''
          }
          <div class="p-4 sm:p-5 rounded-xl bg-green-50 border border-green-300">
            <p class="text-xs font-bold uppercase tracking-wider text-green-800 mb-1">Model Answer</p>
            <p class="text-sm sm:text-base text-slate-900">${q.modelAnswer}</p>
          </div>

          <div class="p-4 sm:p-5 rounded-xl bg-white border-2 border-amber-300 space-y-3">
            <p class="text-sm font-bold text-slate-900">Self-Check Checklist: Tick what you included in your answer:</p>
            <div class="space-y-2">
              ${q.checklist
                .map(
                  (item, idx) => `
                <label class="flex items-start gap-2.5 text-sm text-slate-800 cursor-pointer">
                  <input type="checkbox" class="self-check-box mt-1 accent-green-700 w-4 h-4" value="${idx}" />
                  <span>${item}</span>
                </label>
              `
                )
                .join('')}
            </div>
            <div class="pt-2">
              <button onclick="app.finalizeSelfCheck()" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-800 transition">
                Save Self-Check & Continue →
              </button>
            </div>
          </div>
        `;
      },

      finalizeSelfCheck() {
        const q = this.state.sessionQuestions[this.state.currentQuestionIndex];
        const boxes = document.querySelectorAll('.self-check-box');
        let checkedCount = 0;
        boxes.forEach((b) => {
          b.disabled = true;
          if (b.checked) checkedCount++;
        });

        // If student ticked all or all-minus-1 checklist items, count as mastered
        const isCorrect = checkedCount >= Math.max(1, boxes.length - 1);
        document.getElementById('selfCheckArea').classList.add('opacity-85');
        const msg = isCorrect
          ? 'Great self-check! Checking your own work against key story clues is the best way to prepare for Sections 3 and 4 of the exam.'
          : 'Thanks for honest self-checking! We added this topic to your Study Focus Plan so you can practice it again.';
        this.recordAndShowFeedback(isCorrect, msg);
      },

      toggleHint(id) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('hidden');
      },

      showInlineAlert(message) {
        let alertBox = document.getElementById('inlineAlertBox');
        if (!alertBox) {
          alertBox = document.createElement('div');
          alertBox.id = 'inlineAlertBox';
          alertBox.className = 'mt-4 p-3 rounded-xl bg-amber-100 border border-amber-400 text-amber-950 text-xs sm:text-sm font-semibold';
          document.getElementById('questionWorkspace').appendChild(alertBox);
        }
        alertBox.textContent = `⚠️ ${message}`;
      },

      /**
       * Record Result & Show Encouraging Feedback Banner
       */
      recordAndShowFeedback(isCorrect, explanationText) {
        const inlineAlert = document.getElementById('inlineAlertBox');
        if (inlineAlert) inlineAlert.remove();

        const q = this.state.sessionQuestions[this.state.currentQuestionIndex];
        this.state.sessionResults.push({
          questionId: q.id,
          topic: q.topic,
          skill: q.skill,
          isCorrect
        });

        const isLast = this.state.currentQuestionIndex === this.state.sessionQuestions.length - 1;
        const feedbackArea = document.getElementById('feedbackArea');
        feedbackArea.classList.remove('hidden');

        feedbackArea.innerHTML = `
          <div class="p-4 sm:p-5 rounded-xl ${
            isCorrect ? 'bg-green-50 border border-green-300' : 'bg-amber-50 border border-amber-300'
          } flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1">
              <p class="font-extrabold text-sm sm:text-base ${
                isCorrect ? 'text-green-800' : 'text-amber-900'
              }">
                ${isCorrect ? '🎉 Spot on!' : '💡 Good try! Here is what to remember:'}
              </p>
              <p class="text-sm text-slate-800">${explanationText}</p>
            </div>
            <button
              onclick="app.nextQuestion()"
              class="px-5 py-3 rounded-xl bg-slate-900 text-white font-bold text-sm hover:bg-slate-800 transition shrink-0 shadow-sm"
            >
              ${isLast ? 'Finish & See Score →' : 'Next Question →'}
            </button>
          </div>
        `;
      },

      nextQuestion() {
        if (this.state.currentQuestionIndex < this.state.sessionQuestions.length - 1) {
          this.state.currentQuestionIndex++;
          this.render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          this.completeMission();
        }
      },

      /**
       * Save Mission Progress & Evaluate 80% Mastery Loop
       */
      completeMission() {
        const total = this.state.sessionResults.length;
        const correct = this.state.sessionResults.filter((r) => r.isCorrect).length;
        const scorePct = Math.round((correct / total) * 100);
        const passed = scorePct >= 80;

        const mId = this.state.currentMissionId;
        if (mId && mId !== 'weakest_practice') {
          const existing = this.state.missionProgress[mId] || {
            bestScore: 0,
            mastered: false,
            firstAttemptResults: {}
          };

          // Save first-attempt results if not already recorded for those question IDs
          this.state.sessionResults.forEach((res) => {
            if (existing.firstAttemptResults[res.questionId] === undefined) {
              existing.firstAttemptResults[res.questionId] = res.isCorrect;
            }
          });

          if (!this.state.isRetryMode) {
            existing.bestScore = Math.max(existing.bestScore, scorePct);
            if (passed) existing.mastered = true;
          } else {
            // In 2-question Confidence Retry, passing (2/2 = 100%) unlocks the mission badge!
            if (passed) {
              existing.mastered = true;
              existing.bestScore = Math.max(existing.bestScore, 80);
            }
          }

          this.state.missionProgress[mId] = existing;
          this.saveState();
        }

        this.state.lastScorePct = scorePct;
        this.state.lastPassed = passed;
        this.state.activeView = 'mission_complete';
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      /**
       * MISSION COMPLETE SCREEN (80% Mastery Badge OR Confidence Retry Unlock)
       */
      renderMissionComplete() {
        const mId = this.state.currentMissionId;
        const mission = MISSIONS.find((m) => m.id === mId);
        const score = this.state.lastScorePct;
        const passed = this.state.lastPassed;

        const missedTopics = [
          ...new Set(this.state.sessionResults.filter((r) => !r.isCorrect).map((r) => r.topic))
        ];

        if (mId === 'weakest_practice') {
          return `
            <div class="myth-card p-6 sm:p-10 text-center space-y-5 max-w-2xl mx-auto">
              <div class="text-5xl">🌟</div>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Targeted Practice Complete!</h1>
              <p class="text-lg font-bold text-amber-800">You scored ${score}% on your focus area.</p>
              <p class="text-sm sm:text-base text-slate-600">
                Every practice round strengthens your memory before the Term 1 English B exam.
              </p>
              <div class="pt-4 flex flex-wrap justify-center gap-3">
                <button onclick="app.showSummary()" class="px-5 py-3 rounded-xl bg-slate-900 text-white font-bold text-sm hover:bg-slate-800">
                  Back to My Study Plan
                </button>
                <button onclick="app.goHome()" class="px-5 py-3 rounded-xl bg-slate-100 text-slate-800 font-bold text-sm hover:bg-slate-200">
                  All Missions
                </button>
              </div>
            </div>
          `;
        }

        return `
          <div class="myth-card p-6 sm:p-10 text-center space-y-5 max-w-2xl mx-auto">
            <div class="text-5xl">${passed ? '🏅' : '🧭'}</div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">
              ${
                passed
                  ? `Badge Unlocked: ${mission.badgeName}!`
                  : `Almost There! You Scored ${score}%`
              }
            </h1>
            <p class="text-base sm:text-lg font-semibold ${passed ? 'text-green-700' : 'text-amber-800'}">
              ${
                passed
                  ? `Awesome job! You scored ${score}% (80%+ needed) on ${mission.title}.`
                  : `You need 80% to earn the ${mission.badgeName} badge. Take a quick 2-question Confidence Boost on the parts you missed!`
              }
            </p>

            ${
              missedTopics.length > 0
                ? `<div class="p-4 rounded-xl bg-amber-50 border border-amber-200 text-left text-sm">
                    <p class="font-bold text-amber-950 mb-1">Topics to double-check:</p>
                    <ul class="list-disc list-inside text-slate-700 space-y-1">
                      ${missedTopics.map((t) => `<li>${t}</li>`).join('')}
                    </ul>
                  </div>`
                : ''
            }

            <div class="pt-4 flex flex-wrap justify-center gap-3">
              ${
                !passed
                  ? `<button onclick="app.startConfidenceRetry('${mission.id}')" class="px-6 py-3 rounded-xl bg-amber-700 text-white font-bold text-sm hover:bg-amber-800 shadow-sm">
                      ⚡ Start 2-Question Confidence Boost
                    </button>`
                  : ''
              }
              <button onclick="app.goHome()" class="px-5 py-3 rounded-xl bg-slate-900 text-white font-bold text-sm hover:bg-slate-800">
                Back to Mission Map
              </button>
              <button onclick="app.showSummary()" class="px-5 py-3 rounded-xl bg-slate-100 text-slate-800 font-bold text-sm hover:bg-slate-200">
                📊 View My Study Plan
              </button>
            </div>
          </div>
        `;
      },

      /**
       * PERSONALIZED STUDY FOCUS PLAN ("Exam-Ready Summary" Screen)
       */
      renderSummaryView() {
        // Aggregate all first-attempt results across all missions
        const allQuestionsMap = {};
        MISSIONS.forEach((m) => m.questions.forEach((q) => (allQuestionsMap[q.id] = q)));
        EXTRA_RETRY_QUESTIONS.forEach((q) => (allQuestionsMap[q.id] = q));

        const skillStats = {
          Knowledge: { total: 0, correct: 0, missedTopics: new Set() },
          Understanding: { total: 0, correct: 0, missedTopics: new Set() },
          Application: { total: 0, correct: 0, missedTopics: new Set() }
        };

        let totalAttempted = 0;

        Object.values(this.state.missionProgress).forEach((prog) => {
          if (!prog.firstAttemptResults) return;
          Object.entries(prog.firstAttemptResults).forEach(([qId, wasCorrect]) => {
            const q = allQuestionsMap[qId];
            if (!q) return;
            totalAttempted++;
            skillStats[q.skill].total++;
            if (wasCorrect) {
              skillStats[q.skill].correct++;
            } else {
              skillStats[q.skill].missedTopics.add(q.topic);
            }
          });
        });

        // Determine weakest skill area
        let weakestSkill = 'Knowledge';
        let lowestPct = 101;
        Object.entries(skillStats).forEach(([skill, st]) => {
          const pct = st.total > 0 ? Math.round((st.correct / st.total) * 100) : 0;
          if (pct < lowestPct) {
            lowestPct = pct;
            weakestSkill = skill;
          }
        });

        const renderSkillCard = (skillKey, friendlyTitle, tipText) => {
          const st = skillStats[skillKey];
          const pct = st.total > 0 ? Math.round((st.correct / st.total) * 100) : null;
          const missedList = Array.from(st.missedTopics);

          return `
            <div class="myth-card p-5 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h3 class="font-bold text-base sm:text-lg text-slate-900">${friendlyTitle}</h3>
                <span class="px-3 py-1 rounded-full text-xs font-extrabold ${
                  pct === null
                    ? 'bg-slate-100 text-slate-600'
                    : pct >= 80
                    ? 'bg-green-100 text-green-800'
                    : 'bg-amber-100 text-amber-900'
                }">
                  ${pct === null ? 'Not practiced yet' : `${pct}% (${st.correct}/${st.total} first try)`}
                </span>
              </div>

              ${
                missedList.length > 0
                  ? `<div class="text-sm text-slate-700">
                      <p class="font-semibold text-amber-900 mb-1">Topics to review from your Scheme of Work:</p>
                      <ul class="list-disc list-inside space-y-0.5 text-slate-700">
                        ${missedList.map((t) => `<li>${t}</li>`).join('')}
                      </ul>
                    </div>`
                  : `<p class="text-sm text-slate-600">
                      ${
                        pct === null
                          ? 'Complete missions on the home screen to see your personalized feedback here.'
                          : '✅ Looking strong! Keep reviewing your class notes so these details stay fresh.'
                      }
                    </p>`
              }

              <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm text-slate-700">
                <strong>Study Tip:</strong> ${tipText}
              </div>
            </div>
          `;
        };

        return `
          <div class="space-y-6">
            <div class="flex items-center justify-between">
              <button onclick="app.goHome()" class="text-sm font-semibold text-slate-600 hover:text-slate-900">
                ← Back to Missions
              </button>
            </div>

            <div class="myth-card p-6 sm:p-8 bg-gradient-to-br from-white to-amber-50/50">
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <span class="inline-block px-3 py-1 rounded-full bg-slate-800 text-white text-xs font-bold mb-2">
                    Exam-Ready Checkup
                  </span>
                  <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">My Personalized Study Plan</h1>
                  <p class="text-sm sm:text-base text-slate-600 mt-1">
                    Based on your first tries across all missions (${totalAttempted} questions tracked), here is where to focus before your Form 1 English B exam.
                  </p>
                </div>

                <button
                  onclick="app.startWeakestPractice('${weakestSkill}')"
                  class="px-5 py-3.5 rounded-xl bg-amber-700 text-white font-bold text-sm hover:bg-amber-800 transition shadow-sm shrink-0"
                >
                  🎯 Practice My Weakest Area
                </button>
              </div>
            </div>

            <div class="space-y-4">
              ${renderSkillCard(
                'Knowledge',
                '1. Facts & Characters to Review (Knowledge)',
                'Quiz yourself on who gave each magical gift (Hermes’s shoes, Athene’s mirrored shield, Pluto’s helmet) and exact story details from McCaughrean’s book (like the wooden chest, six pomegranate seeds, and sun warning).'
              )}

              ${renderSkillCard(
                'Understanding',
                '2. Story Meanings to Strengthen (Understanding)',
                'For Section 3 extracts, always ask two questions: (1) What in nature does this myth explain (seasons, spiders, echoes, flowers)? and (2) What mistake or feeling caused the character’s problem?'
              )}

              ${renderSkillCard(
                'Application',
                '3. Real-World Links & Critical Thinking to Practice (Application)',
                'For Section 4, state your Claim clearly in Step 1, then make sure Step 2 and Step 3 give real events from our stories that directly prove that exact Claim!'
              )}
            </div>
          </div>
        `;
      }
    };

    // Start app cleanly on load
    window.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
</body>
</html>
