<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAPE Digital Media Unit 2 — Interactive Revision Hub</title>
  <style>
    :root {
      --bg-page: #FAF9F6;
      --bg-card: #FFFFFF;
      --bg-subtle: #F2EFE9;
      --bg-accent-soft: #E8F1F5;
      --text-main: #1F2421;
      --text-muted: #525B56;
      --primary: #1B5E7A;
      --primary-hover: #14475D;
      --success: #236B43;
      --success-bg: #E7F4ED;
      --warning: #8A5300;
      --warning-bg: #FFF5E4;
      --error: #9B2C2C;
      --error-bg: #FDECEC;
      --border: #DCD7CD;
      --radius: 12px;
      --font-sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
      --base-size: 17px;
      --line-height: 1.65;
      --letter-spacing: 0.01em;
      --word-spacing: 0.04em;
    }

    body.reading-support {
      --base-size: 19.5px;
      --line-height: 1.9;
      --letter-spacing: 0.045em;
      --word-spacing: 0.14em;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: var(--base-size);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing);
      word-spacing: var(--word-spacing);
      transition: font-size 0.2s ease, line-height 0.2s ease, letter-spacing 0.2s ease;
    }

    header {
      background-color: var(--bg-card);
      border-bottom: 2px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-title {
      font-size: 1.15em;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
    }

    .brand-sub {
      font-size: 0.85em;
      color: var(--text-muted);
      margin: 0.15rem 0 0 0;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
    }

    button {
      font-family: inherit;
      font-size: 0.92em;
      letter-spacing: inherit;
      word-spacing: inherit;
      cursor: pointer;
      border-radius: 8px;
      padding: 0.6rem 1.05rem;
      font-weight: 600;
      border: 2px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--bg-subtle);
      color: var(--text-main);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background-color: #E6E1D8;
    }

    .btn-toggle[aria-pressed="true"] {
      background-color: var(--bg-accent-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
      font-size: 0.85em;
      padding: 0.5rem 0.8rem;
    }

    .btn-danger-ghost:hover {
      color: var(--error);
      border-color: var(--error);
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 4rem 1.25rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .hero-banner {
      background-color: var(--bg-accent-soft);
      border-color: #BDD5E0;
    }

    .hero-banner h1 {
      margin-top: 0;
      font-size: 1.45em;
      color: var(--primary);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .pill {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.8em;
      font-weight: 600;
      background-color: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .pill-badge {
      background-color: var(--success-bg);
      color: var(--success);
      border-color: #A7D7BC;
    }

    .pill-retry {
      background-color: var(--warning-bg);
      color: var(--warning);
      border-color: #E7C389;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-top: 1.25rem;
    }

    .mission-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin-bottom: 0;
    }

    .mission-card h2 {
      font-size: 1.15em;
      margin: 0.4rem 0 0.5rem 0;
    }

    .mission-meta {
      font-size: 0.85em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background-color: var(--bg-subtle);
      border-radius: 999px;
      overflow: hidden;
      margin: 0.6rem 0;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    .progress-fill.mastered {
      background-color: var(--success);
    }

    /* Question Workspace */
    .workspace-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.85rem;
      border-bottom: 2px solid var(--border);
    }

    .tag-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }

    .scenario-box {
      background-color: var(--bg-subtle);
      border-left: 5px solid var(--primary);
      padding: 1rem 1.2rem;
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.2rem;
    }

    .question-prompt {
      font-weight: 700;
      font-size: 1.08em;
      margin-bottom: 1rem;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-btn {
      text-align: left;
      background-color: var(--bg-card);
      border: 2px solid var(--border);
      color: var(--text-main);
      padding: 0.9rem 1.1rem;
      font-weight: 500;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: var(--bg-accent-soft);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: var(--bg-accent-soft);
    }

    .option-btn.correct {
      border-color: var(--success);
      background-color: var(--success-bg);
    }

    .option-btn.incorrect {
      border-color: var(--error);
      background-color: var(--error-bg);
    }

    .option-letter {
      font-weight: 700;
      color: var(--primary);
      min-width: 1.5rem;
    }

    /* Tables (Matching & Spot-the-Error Audit) */
    .audit-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }

    .audit-table th,
    .audit-table td {
      border: 2px solid var(--border);
      padding: 0.8rem;
      text-align: left;
      vertical-align: top;
    }

    .audit-table th {
      background-color: var(--bg-subtle);
      font-weight: 700;
    }

    select.table-select {
      width: 100%;
      padding: 0.55rem;
      font-family: inherit;
      font-size: 0.95em;
      border-radius: 6px;
      border: 2px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-main);
    }

    select.table-select.row-correct {
      border-color: var(--success);
      background-color: var(--success-bg);
    }

    select.table-select.row-incorrect {
      border-color: var(--error);
      background-color: var(--error-bg);
    }

    /* Synthesis / Short Answer Scaffolding */
    .hint-box {
      background-color: var(--warning-bg);
      border: 2px solid #E7C389;
      border-radius: 8px;
      padding: 0.95rem 1.1rem;
      margin: 0.85rem 0;
    }

    textarea.synthesis-input {
      width: 100%;
      min-height: 135px;
      padding: 0.9rem;
      font-family: inherit;
      font-size: 1em;
      line-height: inherit;
      letter-spacing: inherit;
      border: 2px solid var(--border);
      border-radius: 8px;
      background-color: var(--bg-card);
      color: var(--text-main);
      margin-top: 0.5rem;
    }

    textarea.synthesis-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .rubric-checklist {
      background-color: var(--bg-subtle);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem;
      margin-top: 1rem;
    }

    .rubric-item {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      margin: 0.65rem 0;
      cursor: pointer;
    }

    .rubric-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 0.2rem;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .model-answer-box {
      background-color: var(--success-bg);
      border: 2px solid #A7D7BC;
      border-radius: 8px;
      padding: 1rem 1.15rem;
      margin-top: 1rem;
    }

    .feedback-panel {
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-top: 1.2rem;
      border: 2px solid transparent;
    }

    .feedback-panel.pass {
      background-color: var(--success-bg);
      border-color: #A7D7BC;
    }

    .feedback-panel.fail {
      background-color: var(--error-bg);
      border-color: #E5A9A9;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.25rem;
      align-items: center;
    }

    /* Diagnostic Summary */
    .diagnostic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }

    .diag-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem;
      background-color: var(--bg-card);
    }

    .diag-card h3 {
      margin-top: 0;
      font-size: 1.05em;
      color: var(--primary);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .card {
        padding: 1.1rem;
      }
      .audit-table th, .audit-table td {
        padding: 0.55rem;
        font-size: 0.92em;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <p class="brand-title">CAPE Digital Media Unit 2 — Revision Hub</p>

    </div>
    <div class="header-controls">
      <button id="readingToggleBtn" class="btn-secondary btn-toggle" aria-pressed="false" title="Increase font size, line spacing, and letter spacing">

      </button>
      <button id="homeNavBtn" class="btn-secondary">Mission Map</button>
      <button id="summaryNavBtn" class="btn-primary">Exam-Ready Summary</button>
    </div>
  </div>
</header>

<main id="appRoot"></main>

/**
 * APPLICATION STATE & LOCALSTORAGE PERSISTENCE
 */
const STORAGE_KEY = "cape_dm_u2_revision_hub_v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    console.warn("Could not read localStorage", e);
  }
  return {
    readingSupport: false,
    missions: {},
    attempts: {}
  };
}

let appState = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  } catch (e) {
    console.warn("Could not save localStorage", e);
  }
}

// Runtime view state
let currentView = {
  screen: "home",
  missionId: null,
  mode: "main",
  qIndex: 0,
  questionPool: [],
  sessionAnswers: {},
  selectedOption: null,
  tableSelections: {}
};

// Apply reading support preference on boot
function applyReadingSupportUI() {
  const btn = document.getElementById("readingToggleBtn");
  if (appState.readingSupport) {
    document.body.classList.add("reading-support");
    btn.setAttribute("aria-pressed", "true");
    btn.textContent = "Aa Reading Support: On";
  } else {
    document.body.classList.remove("reading-support");
    btn.setAttribute("aria-pressed", "false");
    btn.textContent = "Aa Reading Support: Off";
  }
}

document.getElementById("readingToggleBtn").addEventListener("click", () => {
  appState.readingSupport = !appState.readingSupport;
  saveState();
  applyReadingSupportUI();
});

document.getElementById("homeNavBtn").addEventListener("click", () => {
  currentView.screen = "home";
  render();
});

document.getElementById("summaryNavBtn").addEventListener("click", () => {
  currentView.screen = "summary";
  render();
});

/**
 * HELPER FUNCTIONS
 */
function getMissionProgress(missionId) {
  return appState.missions[missionId] || {
    completed: false,
    scorePct: 0,
    mastered: false,
    retryUnlocked: false,
    retryCompleted: false
  };
}

function recordAttempt(q, missionId, isCorrect) {
  const existing = appState.attempts[q.id];
  appState.attempts[q.id] = {
    firstCorrect: existing ? existing.firstCorrect : isCorrect,
    latestCorrect: isCorrect,
    srCode: q.srCode,
    lessonTopic: q.lessonTopic,
    cognitiveLevel: q.cognitiveLevel,
    missionId: missionId,
    studyTip: q.studyTip || "Review the scheme-of-work criteria and practice tying every answer to your named site."
  };
  saveState();
}

function startMission(missionId, mode = "main") {
  const mission = MISSIONS.find(m => m.id === missionId);
  if (!mission) return;

  const pool = mode === "retry" ? mission.retryQuestions : mission.questions;
  currentView = {
    screen: "mission",
    missionId: mission.id,
    mode: mode,
    qIndex: 0,
    questionPool: pool,
    sessionAnswers: {},
    selectedOption: null,
    tableSelections: {}
  };
  render();
}

function startWeakestPractice() {
  const missedIds = Object.keys(appState.attempts).filter(
    qId => !appState.attempts[qId].firstCorrect || !appState.attempts[qId].latestCorrect
  );

  const allQuestions = [];
  MISSIONS.forEach(m => {
    m.questions.forEach(q => allQuestions.push({ ...q, _missionId: m.id }));
    m.retryQuestions.forEach(q => allQuestions.push({ ...q, _missionId: m.id }));
  });

  const pool = allQuestions.filter(q => missedIds.includes(q.id));
  if (pool.length === 0) {
    alert("You have no missed questions to practice right now! Try any mission to test yourself.");
    return;
  }

  currentView = {
    screen: "mission",
    missionId: "weakest_drill",
    mode: "weakest",
    qIndex: 0,
    questionPool: pool,
    sessionAnswers: {},
    selectedOption: null,
    tableSelections: {}
  };
  render();
}

function resetAllProgress() {
  if (confirm("Reset all mission scores, badges, and diagnostic history? (Your Reading Support setting will be kept.)")) {
    const keepReading = appState.readingSupport;
    appState = {
      readingSupport: keepReading,
      missions: {},
      attempts: {}
    };
    saveState();
    currentView.screen = "home";
    render();
  }
}

/**
 * RENDERERS
 */
function render() {
  const root = document.getElementById("appRoot");
  if (currentView.screen === "home") {
    root.innerHTML = renderHome();
    attachHomeEvents();
  } else if (currentView.screen === "mission") {
    root.innerHTML = renderMissionWorkspace();
    attachMissionEvents();
  } else if (currentView.screen === "summary") {
    root.innerHTML = renderSummary();
    attachSummaryEvents();
  }
}

function renderHome() {
  const masteredCount = MISSIONS.filter(m => getMissionProgress(m.id).mastered).length;
  const attemptedTotal = Object.keys(appState.attempts).length;

  const missionCardsHtml = MISSIONS.map(m => {
    const prog = getMissionProgress(m.id);
    let statusBadge = `<span class="pill">Not Started</span>`;
    if (prog.mastered) {
      statusBadge = `<span class="pill pill-badge">★ Mastered (${prog.scorePct}%) · ${m.badgeName}</span>`;
    } else if (prog.retryUnlocked) {
      statusBadge = `<span class="pill pill-retry">Score: ${prog.scorePct}% · Confidence Retry Ready</span>`;
    } else if (prog.completed) {
      statusBadge = `<span class="pill">Completed (${prog.scorePct}%)</span>`;
    }

    const retryBtnHtml = prog.retryUnlocked && !prog.mastered
      ? `<button class="btn-primary start-retry-btn" data-id="${m.id}">Launch 2-Question Confidence Retry</button>`
      : "";

    return `
      <article class="card mission-card">
        <div>
          <div class="pill-row">
            <span class="pill">${m.unitCode}</span>
            ${statusBadge}
          </div>
          <h2>${m.title}</h2>
          <p class="mission-meta"><strong>Scheme of Work:</strong> ${m.lessonTopics}</p>
          <p>${m.description}</p>
        </div>
        <div>
          <div class="progress-track" aria-label="Mission mastery progress">
            <div class="progress-fill ${prog.mastered ? 'mastered' : ''}" style="width: ${prog.mastered ? 100 : prog.scorePct}%"></div>
          </div>
          <div class="action-row">
            <button class="${prog.retryUnlocked && !prog.mastered ? 'btn-secondary' : 'btn-primary'} start-mission-btn" data-id="${m.id}">
              ${prog.completed ? "Practice Mission Again" : "Start Mission"}
            </button>
            ${retryBtnHtml}
          </div>
        </div>
      </article>
    `;
  }).join("");

  return `
    <section class="card hero-banner">
      <h1>Welcome to Your CAPE Digital Media Unit 2 Revision Hub</h1>
      <p>
        Build exam confidence through four bite-sized mastery missions aligned with your syllabus and Paper 02 mark scheme.
        There are <strong>no countdown timers</strong>—take your time, use hints when needed, and aim for <strong>80% mastery</strong> in each unit.
      </p>
      <div class="pill-row">
        <span class="pill pill-badge">Mastery Badges Earned: ${masteredCount} / ${MISSIONS.length}</span>
        <span class="pill">Questions Attempted: ${attemptedTotal}</span>
        <span class="pill">Target Mastery: 80%+ per Mission</span>
      </div>
    </section>

    <section class="mission-grid">
      ${missionCardsHtml}
    </section>

    <div class="action-row" style="justify-content: space-between; margin-top: 2rem;">
      <button id="viewSummaryBottomBtn" class="btn-primary">View Personalized Exam-Ready Summary →</button>
      <button id="resetProgressBtn" class="btn-danger-ghost">Reset Saved Progress</button>
    </div>
  `;
}

function attachHomeEvents() {
  document.querySelectorAll(".start-mission-btn").forEach(btn => {
    btn.addEventListener("click", () => startMission(btn.dataset.id, "main"));
  });
  document.querySelectorAll(".start-retry-btn").forEach(btn => {
    btn.addEventListener("click", () => startMission(btn.dataset.id, "retry"));
  });
  const sumBtn = document.getElementById("viewSummaryBottomBtn");
  if (sumBtn) sumBtn.addEventListener("click", () => {
    currentView.screen = "summary";
    render();
  });
  const resetBtn = document.getElementById("resetProgressBtn");
  if (resetBtn) resetBtn.addEventListener("click", resetAllProgress);
}

function renderMissionWorkspace() {
  const pool = currentView.questionPool;
  const total = pool.length;
  const idx = currentView.qIndex;

  if (idx >= total) {
    return renderMissionComplete();
  }

  const q = pool[idx];
  const missionObj = MISSIONS.find(m => m.id === (q._missionId || currentView.missionId));
  const missionTitle = currentView.mode === "weakest"
    ? "Targeted Practice: Weakest Scheme-of-Work Areas"
    : currentView.mode === "retry"
      ? `${missionObj.title} — Confidence Retry`
      : missionObj.title;

  const savedAns = currentView.sessionAnswers[q.id];
  const pct = Math.round(((idx) / total) * 100);

  let interactionHtml = "";

  if (q.type === "mcq") {
    const letters = ["A", "B", "C", "D"];
    const optsHtml = q.options.map((opt, i) => {
      let cls = "option-btn";
      if (savedAns) {
        if (i === q.correctIndex) cls += " correct";
        else if (i === savedAns.userChoice && !savedAns.isCorrect) cls += " incorrect";
      } else if (currentView.selectedOption === i) {
        cls += " selected";
      }
      return `
        <button class="${cls}" data-opt="${i}" ${savedAns ? "disabled" : ""}>
          <span class="option-letter">${letters[i]}.</span>
          <span>${opt}</span>
        </button>
      `;
    }).join("");

    interactionHtml = `
      <div class="option-list">${optsHtml}</div>
      ${!savedAns ? `
        <div class="action-row">
          <button id="submitMcqBtn" class="btn-primary">Check Answer</button>
        </div>
      ` : ""}
    `;
  } else if (q.type === "matching" || q.type === "audit") {
    const rowsHtml = q.rows.map((row, rIdx) => {
      const currentVal = savedAns
        ? savedAns.userChoice[rIdx]
        : (currentView.tableSelections[rIdx] || "");
      let selectCls = "table-select";
      if (savedAns) {
        selectCls += (currentVal === row.answer) ? " row-correct" : " row-incorrect";
      }

      const optionsMarkup = [
        `<option value="">-- Select classification --</option>`,
        ...q.choices.map(c => `<option value="${c}" ${currentVal === c ? "selected" : ""}>${c}</option>`)
      ].join("");

      return `
        <tr>
          <td>
            <strong>${row.label}</strong>
            ${savedAns && currentVal !== row.answer ? `<div style="color: var(--success); font-size: 0.9em; margin-top: 0.35rem;">✓ Correct match: <strong>${row.answer}</strong></div>` : ""}
          </td>
          <td style="min-width: 230px;">
            <select class="${selectCls}" data-row="${rIdx}" ${savedAns ? "disabled" : ""}>
              ${optionsMarkup}
            </select>
          </td>
        </tr>
      `;
    }).join("");

    interactionHtml = `
      <table class="audit-table">
        <thead>
          <tr>
            <th>Item / Scenario Evidence</th>
            <th>Your Classification</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      ${!savedAns ? `
        <div class="action-row">
          <button id="submitTableBtn" class="btn-primary">Check Table Classifications</button>
        </div>
      ` : ""}
    `;
  } else if (q.type === "synthesis") {
    const draftState = currentView.sessionAnswers[q.id + "_draft"] || { text: "", hintOpen: false, modelOpen: false };
    const rubricHtml = q.rubric.map((item, rIdx) => `
      <label class="rubric-item">
        <input type="checkbox" class="rubric-cb" data-ridx="${rIdx}" ${savedAns ? "disabled checked" : ""} />
        <span>${item}</span>
      </label>
    `).join("");

    interactionHtml = `
      <div class="action-row" style="margin-top: 0;">
        <button id="toggleHintBtn" class="btn-secondary" type="button">
          ${draftState.hintOpen ? "Hide Sentence-Starter Hint" : "Need a Hint? Show Sentence Starter"}
        </button>
      </div>
      ${draftState.hintOpen ? `<div class="hint-box"><strong>Scaffolded Sentence Starter:</strong><br/>${q.hint.replace(/\n/g, "<br/>")}</div>` : ""}

      <label for="synthesisTextarea" style="display:block; margin-top: 0.9rem; font-weight: 600;">
        Step 1 — Try writing your response below:
      </label>
      <textarea id="synthesisTextarea" class="synthesis-input" placeholder="Draft your response here before comparing with the mark-scheme model..." ${savedAns ? "disabled" : ""}>${savedAns ? savedAns.userText : draftState.text}</textarea>

      ${!savedAns && !draftState.modelOpen ? `
        <div class="action-row">
          <button id="revealModelBtn" class="btn-primary">Compare with Model Answer &amp; Mark-Scheme Rubric</button>
        </div>
      ` : ""}

      ${(draftState.modelOpen || savedAns) ? `
        <div class="model-answer-box">
          <strong>Mark-Scheme Model Response:</strong>
          <p style="margin-bottom: 0; white-space: pre-line;">${q.modelAnswer}</p>
        </div>
        <div class="rubric-checklist">
          <strong>Step 2 — Self-Check Rubric (Tick each criterion your response clearly met):</strong>
          ${rubricHtml}
          ${!savedAns ? `
            <div class="action-row">
              <button id="confirmSelfCheckBtn" class="btn-primary">Confirm Self-Check &amp; Record Result</button>
            </div>
          ` : ""}
        </div>
      ` : ""}
    `;
  }

  let feedbackHtml = "";
  if (savedAns) {
    feedbackHtml = `
      <div class="feedback-panel ${savedAns.isCorrect ? "pass" : "fail"}">
        <strong>${savedAns.isCorrect ? "Great work! Concept nailed." : "Good try — let's review the mark-scheme rule:"}</strong>
        <p style="margin: 0.45rem 0 0 0;">${q.explanation || "Compare your self-checked criteria against the model response above to lock in full marks."}</p>
      </div>
      <div class="action-row">
        <button id="nextQuestionBtn" class="btn-primary">
          ${idx + 1 < total ? "Next Question →" : "Finish & See Mission Score →"}
        </button>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="workspace-header">
        <div>
          <strong>${missionTitle}</strong>
          <div style="font-size: 0.88em; color: var(--text-muted);">Question ${idx + 1} of ${total}</div>
        </div>
        <button id="exitMissionBtn" class="btn-secondary">← Back to Mission Map</button>
      </div>

      <div class="progress-track">
        <div class="progress-fill" style="width: ${pct}%"></div>
      </div>

      <div class="tag-strip">
        <span class="pill">Syllabus: ${q.srCode}</span>
        <span class="pill">Topic: ${q.lessonTopic}</span>
        <span class="pill">Cognitive Skill: ${q.cognitiveLevel}</span>
      </div>

      <div class="scenario-box">
        <strong>Scenario:</strong> ${q.scenario}
      </div>

      <div class="question-prompt">${q.prompt}</div>

      ${interactionHtml}
      ${feedbackHtml}
    </div>
  `;
}

function attachMissionEvents() {
  const exitBtn = document.getElementById("exitMissionBtn");
  if (exitBtn) exitBtn.addEventListener("click", () => {
    currentView.screen = "home";
    render();
  });

  const pool = currentView.questionPool;
  const q = pool[currentView.qIndex];
  if (!q) {
    const retryBtn = document.getElementById("launchRetryNowBtn");
    if (retryBtn) retryBtn.addEventListener("click", () => startMission(currentView.missionId, "retry"));
    const mapBtn = document.getElementById("returnMapBtn");
    if (mapBtn) mapBtn.addEventListener("click", () => {
      currentView.screen = "home";
      render();
    });
    const sumBtn = document.getElementById("goSummaryBtn");
    if (sumBtn) sumBtn.addEventListener("click", () => {
      currentView.screen = "summary";
      render();
    });
    return;
  }

  const missionIdForRecord = q._missionId || currentView.missionId;

  if (q.type === "mcq") {
    document.querySelectorAll(".option-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentView.selectedOption = parseInt(btn.dataset.opt, 10);
        render();
      });
    });

    const submitMcq = document.getElementById("submitMcqBtn");
    if (submitMcq) {
      submitMcq.addEventListener("click", () => {
        if (currentView.selectedOption === null) {
          alert("Please select an answer option first.");
          return;
        }
        const isCorrect = currentView.selectedOption === q.correctIndex;
        currentView.sessionAnswers[q.id] = {
          isCorrect,
          userChoice: currentView.selectedOption
        };
        recordAttempt(q, missionIdForRecord, isCorrect);
        render();
      });
    }
  }

  if (q.type === "matching" || q.type === "audit") {
    document.querySelectorAll(".table-select").forEach(sel => {
      sel.addEventListener("change", () => {
        currentView.tableSelections[sel.dataset.row] = sel.value;
      });
    });

    const submitTable = document.getElementById("submitTableBtn");
    if (submitTable) {
      submitTable.addEventListener("click", () => {
        const chosen = {};
        let allFilled = true;
        let correctRows = 0;

        q.rows.forEach((r, idx) => {
          const val = currentView.tableSelections[idx] || "";
          if (!val) allFilled = false;
          chosen[idx] = val;
          if (val === r.answer) correctRows++;
        });

        if (!allFilled) {
          alert("Please select a classification for every row in the table before checking.");
          return;
        }

        const isCorrect = correctRows === q.rows.length;
        currentView.sessionAnswers[q.id] = {
          isCorrect,
          userChoice: chosen
        };
        recordAttempt(q, missionIdForRecord, isCorrect);
        render();
      });
    }
  }

  if (q.type === "synthesis") {
    const draftKey = q.id + "_draft";
    if (!currentView.sessionAnswers[draftKey]) {
      currentView.sessionAnswers[draftKey] = { text: "", hintOpen: false, modelOpen: false };
    }
    const draft = currentView.sessionAnswers[draftKey];

    const ta = document.getElementById("synthesisTextarea");
    if (ta) {
      ta.addEventListener("input", () => {
        draft.text = ta.value;
      });
    }

    const hintBtn = document.getElementById("toggleHintBtn");
    if (hintBtn) {
      hintBtn.addEventListener("click", () => {
        draft.hintOpen = !draft.hintOpen;
        render();
      });
    }

    const revealBtn = document.getElementById("revealModelBtn");
    if (revealBtn) {
      revealBtn.addEventListener("click", () => {
        if (!draft.text || draft.text.trim().length < 15) {
          alert("Try drafting your response in the text box first (at least a full sentence) before revealing the model answer.");
          return;
        }
        draft.modelOpen = true;
        render();
      });
    }

    const confirmSelfBtn = document.getElementById("confirmSelfCheckBtn");
    if (confirmSelfBtn) {
      confirmSelfBtn.addEventListener("click", () => {
        const checkboxes = document.querySelectorAll(".rubric-cb");
        let checkedCount = 0;
        checkboxes.forEach(cb => {
          if (cb.checked) checkedCount++;
        });
        const isCorrect = checkedCount === q.rubric.length;
        currentView.sessionAnswers[q.id] = {
          isCorrect,
          userText: draft.text
        };
        recordAttempt(q, missionIdForRecord, isCorrect);
        render();
      });
    }
  }

  const nextBtn = document.getElementById("nextQuestionBtn");
  if (nextBtn) {
    nextBtn.addEventListener("click", () => {
      currentView.qIndex++;
      currentView.selectedOption = null;
      currentView.tableSelections = {};
      render();
    });
  }
}

function renderMissionComplete() {
  const pool = currentView.questionPool;
  let correctCount = 0;
  pool.forEach(q => {
    if (currentView.sessionAnswers[q.id] && currentView.sessionAnswers[q.id].isCorrect) {
      correctCount++;
    }
  });
  const scorePct = Math.round((correctCount / pool.length) * 100);

  if (currentView.mode === "weakest") {
    return `
      <div class="card">
        <h2>Targeted Weakest-Area Drill Complete!</h2>
        <p>You scored <strong>${correctCount} out of ${pool.length} (${scorePct}%)</strong> on your targeted review items.</p>
        <div class="action-row">
          <button id="goSummaryBtn" class="btn-primary">View Updated Exam-Ready Summary</button>
          <button id="returnMapBtn" class="btn-secondary">Return to Mission Map</button>
        </div>
      </div>
    `;
  }

  const mission = MISSIONS.find(m => m.id === currentView.missionId);
  const prevProg = getMissionProgress(mission.id);

  if (currentView.mode === "main") {
    const passed = scorePct >= 80;
    appState.missions[mission.id] = {
      completed: true,
      scorePct: Math.max(prevProg.scorePct, scorePct),
      mastered: prevProg.mastered || passed,
      retryUnlocked: !passed && !prevProg.mastered,
      retryCompleted: prevProg.retryCompleted
    };
    saveState();

    if (passed) {
      return `
        <div class="card" style="border-color: var(--success);">
          <span class="pill pill-badge">★ Mastery Badge Unlocked: ${mission.badgeName}</span>
          <h2>Mission Mastered! (${scorePct}%)</h2>
          <p>You answered <strong>${correctCount} of ${pool.length}</strong> questions accurately, clearing the 80% mastery threshold for <strong>${mission.unitCode}</strong>.</p>
          <div class="action-row">
            <button id="returnMapBtn" class="btn-primary">Continue to Next Mission</button>
            <button id="goSummaryBtn" class="btn-secondary">Check Exam-Ready Summary</button>
          </div>
        </div>
      `;
    } else {
      return `
        <div class="card" style="border-color: #E7C389;">
          <span class="pill pill-retry">Score: ${scorePct}% · 80% Needed for Mastery Badge</span>
          <h2>Confidence Retry Unlocked!</h2>
          <p>
            You got <strong>${correctCount} of ${pool.length}</strong> right on this run. Before awarding your
            <strong>${mission.badgeName}</strong> badge, complete a quick <strong>2-question Confidence Retry</strong> targeting the key concepts from this unit.
          </p>
          <div class="action-row">
            <button id="launchRetryNowBtn" class="btn-primary">Start 2-Question Confidence Retry →</button>
            <button id="returnMapBtn" class="btn-secondary">Back to Mission Map</button>
          </div>
        </div>
      `;
    }
  } else {
    const retryPassed = scorePct >= 50;
    appState.missions[mission.id] = {
      ...prevProg,
      mastered: retryPassed ? true : prevProg.mastered,
      retryCompleted: true
    };
    saveState();

    return `
      <div class="card" style="border-color: ${retryPassed ? "var(--success)" : "#E7C389"};">
        <span class="pill ${retryPassed ? "pill-badge" : "pill-retry"}">
          ${retryPassed ? "★ Mastery Badge Awarded: " + mission.badgeName : "Keep Practicing"}
        </span>
        <h2>Confidence Retry Score: ${scorePct}% (${correctCount} / ${pool.length})</h2>
        <p>
          ${retryPassed
            ? "Awesome persistence! You strengthened your weak spots and earned the unit Mastery Badge."
            : "Review the explanations in your Exam-Ready Summary, then give the mission or retry another calm pass whenever you're ready."}
        </p>
        <div class="action-row">
          <button id="returnMapBtn" class="btn-primary">Back to Mission Map</button>
          <button id="goSummaryBtn" class="btn-secondary">View Exam-Ready Summary</button>
        </div>
      </div>
    `;
  }
}

function renderSummary() {
  const attemptsList = Object.values(appState.attempts);
  const masteredCount = MISSIONS.filter(m => getMissionProgress(m.id).mastered).length;
  const missedFirst = attemptsList.filter(a => !a.firstCorrect);

  const byCognitive = {
    Knowledge: missedFirst.filter(a => a.cognitiveLevel === "Knowledge"),
    Understanding: missedFirst.filter(a => a.cognitiveLevel === "Understanding"),
    Application: missedFirst.filter(a => a.cognitiveLevel === "Application")
  };

  function renderCategoryItems(items) {
    if (items.length === 0) {
      return `<p style="color: var(--success); margin-bottom: 0;">✓ No first-attempt gaps recorded in this skill area yet!</p>`;
    }
    const seen = new Set();
    const unique = [];
    items.forEach(item => {
      const key = item.srCode + "::" + item.lessonTopic;
      if (!seen.has(key)) {
        seen.add(key);
        unique.push(item);
      }
    });

    return `<ul style="padding-left: 1.2rem; margin-bottom: 0;">
      ${unique.map(u => `
        <li style="margin-bottom: 0.65rem;">
          <strong>[${u.srCode}] ${u.lessonTopic}</strong><br/>
          <span style="font-size: 0.92em; color: var(--text-muted);">Study Tip: ${u.studyTip}</span>
        </li>
      `).join("")}
    </ul>`;
  }

  return `
    <section class="card hero-banner">
      <h1>Exam-Ready Summary &amp; Personalized Study Focus Plan</h1>
      <p>
        This diagnostic analyzes your performance across all CAPE Digital Media Unit 2 missions—including items missed on your first attempt—organized by Scheme-of-Work topic and Cognitive Skill Level.
      </p>
      <div class="pill-row">
        <span class="pill pill-badge">Badges Earned: ${masteredCount} / ${MISSIONS.length}</span>
        <span class="pill">Total Questions Tracked: ${attemptsList.length}</span>
        <span class="pill pill-retry">First-Attempt Areas to Strengthen: ${missedFirst.length}</span>
      </div>
      ${missedFirst.length > 0 ? `
        <div class="action-row">
          <button id="practiceWeakestBtn" class="btn-primary">Practice Weakest Area (${missedFirst.length} Item${missedFirst.length > 1 ? "s" : ""}) →</button>
        </div>
      ` : ""}
    </section>

    <section class="diagnostic-grid">
      <div class="diag-card">
        <h3>1. Knowledge to Review</h3>
        <p style="font-size: 0.9em; color: var(--text-muted);">Definitions, syllabus terminology, web formats, and layout characteristics to revisit:</p>
        ${renderCategoryItems(byCognitive.Knowledge)}
      </div>

      <div class="diag-card">
        <h3>2. Understanding to Strengthen</h3>
        <p style="font-size: 0.9em; color: var(--text-muted);">How and why pre-production stages, concept map rules, and layout models work:</p>
        ${renderCategoryItems(byCognitive.Understanding)}
      </div>

      <div class="diag-card">
        <h3>3. Application to Practice</h3>
        <p style="font-size: 0.9em; color: var(--text-muted);">Diagnosing scenarios, justifying platform/audience choices, and writing mark-scheme synthesis answers:</p>
        ${renderCategoryItems(byCognitive.Application)}
      </div>
    </section>

    <div class="action-row">
      <button id="backHomeFromSummaryBtn" class="btn-secondary">← Return to Mission Map</button>
    </div>
  `;
}

function attachSummaryEvents() {
  const weakBtn = document.getElementById("practiceWeakestBtn");
  if (weakBtn) weakBtn.addEventListener("click", startWeakestPractice);

  const backBtn = document.getElementById("backHomeFromSummaryBtn");
  if (backBtn) backBtn.addEventListener("click", () => {
    currentView.screen = "home";
    render();
  });
}

// Initial boot
applyReadingSupportUI();
render();
</script>
</body>
</html>
